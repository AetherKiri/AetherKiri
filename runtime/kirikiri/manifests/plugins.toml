# AetherKiri KiriKiri plugin capability contract.
#
# This file describes the implementation boundary for every integration that
# is intentionally touched by the krkrz_dev migration.  It is metadata, not a
# second source tree: executable code stays in cpp/plugins or in the pinned
# third_party/krkrz_dev submodule.

schema_version = 1
upstream_repository = "wamsoft/krkrz_dev"
upstream_revision = "83cc5cc4528bf431d16b5d4949cb11966331e392"
source_policy = "pinned-submodule-with-aether-adapters"

# Core policy is intentionally separate from plugin status.  Aether owns the
# linked core ABI and its platform/rendering lifecycle; these upstream files
# are consumed as algorithm references and parity-test inputs until a
# namespaced adapter proves that direct reuse is safe.
core_policy = "aether-owned-with-upstream-parity"

# KAG/TJS assets stay in the nested public submodules.  They are references or
# test fixtures only; no second copy is staged into the Aether runtime source.

# Complete catalog for every immediate directory under src/plugins.  The
# executable [[plugins]] records below describe the modules currently wired
# into Aether; this catalog deliberately also records reference-only and
# host-only modules so an upstream directory can never disappear from the
# review unnoticed.
[plugin_catalog]
direct = [
  "layerExAreaAverage",
  "layerExRaster",
  "layerExLongExposure",
  "getSample",
  "layerExBTOA",
  "layerExImage",
  "shrinkCopy",
]
hybrid = [
    "AlphaMovie",
    "KAGParserEx",
    "clipfile",
    "krkr_richtext",
    "layerExSave",
  "extNagano",
  "layerExVector",
  "psdfile",
]
aether_owner = [
  "addFont",
  "binaryStream",
  "csvParser",
  "expat",
  "extrans",
  "fstat",
  "json",
  "layerEx",
  "layerExDraw",
  "lineParser",
  "memfile",
  "menu",
  "minizip",
  "saveStruct",
  "scriptsEx",
  "varfile",
]
host_compat = [
  "fpslimit",
  "gamepad",
  "httprequest",
  "httpserv",
  "krkrgles",
  "krkrlive2d",
  "messenger",
  "msgreceiver",
  "process",
  "resourceRW",
  "shellExecute",
  "sigcheck",
  "stdio",
  "steam",
  "systemEx",
  "tftSave",
  "win32dialog",
  "win32ole",
  "windowEx",
  "windowExProgress",
]
optional = [
  "krkreffekseer",
  "krkrthreepp",
]
infrastructure = [
  "ncbind",
  "simplebinder",
  "tp_stub",
]

