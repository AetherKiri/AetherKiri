# status values:
#   upstream-adapted  — upstream business source compiled through an Aether ABI shim
#   hybrid            — upstream algorithms plus an Aether-owned runtime/renderer bridge
#   aether            — Aether owns the implementation; upstream is reference-only
#   stub              — name/shape compatibility only, not feature-complete
#   optional          — available behind an explicit future integration switch

