[package]
name = "aether-minori-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "minori-vfs"
path = "src/bin/minori_vfs.rs"

[[bin]]
name = "minori-script"
path = "src/bin/minori_script.rs"

[dependencies]
bincode = "1.3.3"
blowfish = "0.10.0"
byteorder = "1.5.0"
cipher = "0.5.0"
crc32fast = "1.5.0"
encoding_rs = "0.8.35"
miniz_oxide = "0.9.1"
png = "0.18.0"
serde = { version = "1.0", features = ["derive"] }
lewton = "0.10.2"

[profile.dev]
opt-level = 2

[dev-dependencies]
tempfile = "3.23.0"
