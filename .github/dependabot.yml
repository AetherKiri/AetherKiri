version: 2

updates:
  # 根目录的 npm 依赖（TypeScript / Vite / @types/node）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # 把所有 devDependencies（非安全更新）合并成一个 PR，减少噪音
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # Vite 大版本升级可能破坏构建脚本，手动跟进更稳妥
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  # vcpkg：更新 vcpkg-configuration.json 的 default-registry baseline
  # 以及 vcpkg.json 中的 version>= 约束（overlay-ports 里的本地 port 不在范围内）
  - package-ecosystem: "vcpkg"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # baseline 每动一次都要全量重编，合并成一个 PR 减少构建次数
      vcpkg-ports:
        patterns:
          - "*"

  # GitHub Actions 版本升级
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
