name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    uses: ./.github/workflows/build.yml
    with:
      release_version: ${{ github.ref_name }}
      release_build_number: ${{ github.run_number }}
    permissions:
      actions: read
      contents: read
      packages: write
    secrets: inherit

  upload-apple:
    name: Upload ${{ matrix.label }} to App Store Connect
    needs: build
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iOS
            platform: ios
            artifact: ios-release-app-store-ipa
            package_pattern: '*.ipa'
          - label: macOS
            platform: macos
            artifact: macos-release-app-store-pkg
            package_pattern: '*.pkg'
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Checkout upload script
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify App Store Connect API configuration
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64"

      - name: Download signed ${{ matrix.label }} package
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: app-store-package

      - name: Upload ${{ matrix.label }} package
        run: |
          set -euo pipefail
          package_path="$(find app-store-package -type f -name '${{ matrix.package_pattern }}' -print -quit)"
          test -n "$package_path"
          .github/scripts/upload-app-store-connect.sh \
            '${{ matrix.platform }}' \
            "$package_path"

  publish:
    name: Publish GitHub Release
    needs:
      - build
      - upload-apple
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-release-*'
          path: release-assets/downloaded

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          asset_dir="$(pwd)/release-assets"
          download_dir="$asset_dir/downloaded"

          android_apk="$(find "$download_dir/android-release-apk" -type f -name '*.apk' -print -quit)"
          ios_unsigned_ipa="$(find "$download_dir/ios-release-unsigned-ipa" -type f -name '*.ipa' -print -quit)"
          ios_app_store_ipa=""
          if [[ -d "$download_dir/ios-release-app-store-ipa" ]]; then
            ios_app_store_ipa="$(find "$download_dir/ios-release-app-store-ipa" -type f -name '*.ipa' -print -quit)"
          fi
          macos_app_store_pkg=""
          if [[ -d "$download_dir/macos-release-app-store-pkg" ]]; then
            macos_app_store_pkg="$(find "$download_dir/macos-release-app-store-pkg" -type f -name '*.pkg' -print -quit)"
          fi
          test -n "$android_apk"
          test -n "$ios_unsigned_ipa"
          test -d "$download_dir/macos-release-app"
          test -d "$download_dir/web-release-export"

          cp "$android_apk" "$asset_dir/AetherKiri-${tag}-android.apk"
          cp "$ios_unsigned_ipa" "$asset_dir/AetherKiri-${tag}-ios-unsigned.ipa"
          if [[ -n "$ios_app_store_ipa" ]]; then
            cp "$ios_app_store_ipa" "$asset_dir/AetherKiri-${tag}-ios-app-store.ipa"
          fi
          if [[ -n "$macos_app_store_pkg" ]]; then
            cp "$macos_app_store_pkg" "$asset_dir/AetherKiri-${tag}-macos-app-store.pkg"
          fi

          (
            cd "$download_dir/macos-release-app"
            zip -qry "$asset_dir/AetherKiri-${tag}-macos.zip" .
          )
          (
            cd "$download_dir/web-release-export"
            zip -qry "$asset_dir/AetherKiri-${tag}-web.zip" .
          )

          rm -rf "$download_dir"

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          assets=(release-assets/*)

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            exit 0
          fi

          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --title "$tag"
            --generate-notes
            --verify-tag
          )
          if [[ "$tag" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$tag" "${assets[@]}" "${release_args[@]}"
