      - name: Build macOS Release
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          ./build.sh macos release --jobs=4

      - name: Build macOS Debug
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          ./build.sh macos debug --jobs=4

      - name: Run OnscripterYuri Godot smoke test
        env:
          AETHERKIRI_SMOKE_GAME: ${{ github.workspace }}/tests/fixtures/onscripter_smoke
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless \
            --path apps/godot_app \
            --script res://scripts/smoke_test.gd

      - name: Run native motionplayer contract tests
        run: |
          set -euo pipefail
          test_build_dir="${GITHUB_WORKSPACE}/out/macos/ci-tests"
          configure_log="${RUNNER_TEMP}/aetherkiri-test-configure.log"

          cmake --preset "MacOS Debug Config" --fresh \
            -B "$test_build_dir" \
            -D ENABLE_TESTS=ON \
            -D BUILD_TOOLS=OFF \
            -D BUILD_ENGINE_API=OFF \
            -D BUILD_GODOT_EXTENSION=OFF \
            -D VCPKG_MANIFEST_INSTALL=OFF \
            -D VCPKG_INSTALLED_DIR="${GITHUB_WORKSPACE}/out/macos/debug/vcpkg_installed" \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            2>&1 | tee "$configure_log"

          if [[ "$AETHERKIRI_WITH_INTERNAL" == "true" ]]; then
            grep -F "AetherInternal E-mote/Live2D package: enabled" "$configure_log"
          else
            grep -F "AetherInternal package: unavailable; using public fallbacks" "$configure_log"
          fi

          cmake --build "$test_build_dir" --parallel 4
          ctest --test-dir "$test_build_dir" --output-on-failure --parallel 4

      - name: Verify built .app
        run: |
          set -euo pipefail
          for build_type in release debug; do
            APP_PATH="out/godot/macos/${build_type}/Aether.app"
            if [[ ! -d "$APP_PATH" ]]; then
              echo "Built Godot ${build_type} .app bundle not found: $APP_PATH" >&2
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          done

      - name: Upload Release App
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-app
          path: out/godot/macos/release/
          retention-days: 7

      - name: Upload Debug App
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: macos-debug-app
          path: out/godot/macos/debug/
          retention-days: 7

      - name: Save vcpkg cache
        if: success() && github.event_name != 'pull_request' && steps.restore-vcpkg.outputs.cache-matched-key == ''
        uses: actions/cache/save@v5
        with:
          path: |
            .devtools/vcpkg
            ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-macos-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg/**') }}

      - name: Save ccache
        if: success() && github.event_name != 'pull_request' && steps.restore-ccache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-macos-ccache

  web:
    name: Build Web App
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      EMSDK_VERSION: 4.0.15
      GODOT_RELEASE: 4.7-stable
      GODOT_TEMPLATE_VERSION: 4.7.stable

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: ${{ env.AETHERKIRI_WITH_INTERNAL == 'true' && 'recursive' || 'false' }}
          ssh-key: ${{ env.AETHERKIRI_WITH_INTERNAL == 'true' && secrets.AETHERSECRET || '' }}
          persist-credentials: false

      - name: Initialize public OnscripterYuri package
        if: env.AETHERKIRI_WITH_INTERNAL != 'true'
        run: git submodule update --init --depth 1 packages/OnscripterYuri

      - name: Verify AetherInternal package
        if: env.AETHERKIRI_WITH_INTERNAL == 'true'
        run: |
          set -euo pipefail
          test -f packages/AetherInternal/cmake/AetherInternalConfig.cmake
          git submodule status --recursive

      - name: Install Build Systems
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config autoconf automake libtool gettext bison flex curl unzip zip zstd ccache jq python3

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Restore Emscripten cache
        id: restore-emsdk
        uses: actions/cache/restore@v5
        with:
          path: .devtools/emsdk
          key: ${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten
        run: |
          set -euo pipefail
          mkdir -p .devtools
          if [[ ! -d ".devtools/emsdk/.git" ]]; then
            rm -rf .devtools/emsdk
            git clone https://github.com/emscripten-core/emsdk.git .devtools/emsdk
          fi
          .devtools/emsdk/emsdk install "$EMSDK_VERSION"
          .devtools/emsdk/emsdk activate "$EMSDK_VERSION"
          {
            echo "EMSDK=${GITHUB_WORKSPACE}/.devtools/emsdk"
            echo "EMSCRIPTEN_ROOT=${GITHUB_WORKSPACE}/.devtools/emsdk/upstream/emscripten"
            echo "EMSDK_PYTHON=$(command -v python3)"
          } >> "$GITHUB_ENV"
          {
            echo "${GITHUB_WORKSPACE}/.devtools/emsdk"
            echo "${GITHUB_WORKSPACE}/.devtools/emsdk/upstream/emscripten"
          } >> "$GITHUB_PATH"

      - name: Install Godot export tools
        run: |
          set -euo pipefail
          mkdir -p .godot "${RUNNER_TEMP}/godot-templates"
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/godot-linux.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -tq "${RUNNER_TEMP}/godot-linux.zip"
          unzip -q "${RUNNER_TEMP}/godot-linux.zip" -d .godot
          godot_bin="$(find .godot -maxdepth 1 -type f -name 'Godot*_linux.x86_64' | head -1)"
          if [[ -z "$godot_bin" ]]; then
            echo "Godot Linux binary not found after unzip" >&2
            exit 1
          fi
          chmod +x "$godot_bin"

          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/godot-export-templates.tpz" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -tq "${RUNNER_TEMP}/godot-export-templates.tpz"
          unzip -q "${RUNNER_TEMP}/godot-export-templates.tpz" -d "${RUNNER_TEMP}/godot-templates"
          template_dir="${HOME}/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$template_dir"
          cp -a "${RUNNER_TEMP}/godot-templates/templates/." "$template_dir/"

          {
            echo "GODOT_BIN=${GITHUB_WORKSPACE}/${godot_bin}"
            echo "GODOT_TEMPLATE_DIR=${template_dir}"
          } >> "$GITHUB_ENV"

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-web-ccache

      - name: Setup ccache config
        run: |
          ccache --max-size=1000M
          ccache -z

      - name: Restore vcpkg cache
        id: restore-vcpkg
        uses: actions/cache/restore@v5
        with:
          path: |
            .devtools/vcpkg
            ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-web-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg/**') }}
          restore-keys: |
            ${{ runner.os }}-web-vcpkg-

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [[ -d ".devtools/vcpkg" && ! -f ".devtools/vcpkg/.vcpkg-root" ]]; then
            rm -rf .devtools/vcpkg
          fi
          if [[ ! -d ".devtools/vcpkg/.git" ]]; then
            mkdir -p .devtools
            git clone https://github.com/microsoft/vcpkg.git .devtools/vcpkg
          fi
          if [[ ! -x ".devtools/vcpkg/vcpkg" ]]; then
            (cd .devtools/vcpkg && ./bootstrap-vcpkg.sh -disableMetrics)
          fi
          echo "VCPKG_ROOT=${GITHUB_WORKSPACE}/.devtools/vcpkg" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck Web scripts
        run: npm run typecheck

      - name: Build Web Release
        run: |
          set -euo pipefail
          source .devtools/emsdk/emsdk_env.sh
          chmod +x ./build.sh
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          ./build.sh web release --jobs=4 2>&1 | tee "${RUNNER_TEMP}/web-build.log"
          if grep -E "SCRIPT ERROR|Failed to load script|Can't open GDExtension|Can't open dynamic library" "${RUNNER_TEMP}/web-build.log"; then
            echo "Godot Web export logged script or GDExtension load errors." >&2
            exit 1
          fi

      - name: Verify Web export
        run: |
          set -euo pipefail
          test -f out/godot/web/release/index.html
          test -f out/godot/web/release/index.wasm
          test -f out/godot/web/release/index.pck
          test -f out/godot/web/release/live2d/aetherkiri-live2d-bridge.js
          node --check build/web_export_local_picker.js
          node --check build/web_export_range_fs.js
          node --check build/patch_web_export.mjs

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: web-release-export
          path: out/godot/web/release
          retention-days: 7

      - name: Save vcpkg cache
        if: success() && github.event_name != 'pull_request' && steps.restore-vcpkg.outputs.cache-matched-key == ''
        uses: actions/cache/save@v5
        with:
          path: |
            .devtools/vcpkg
            ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-web-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg/**') }}

      - name: Save Emscripten cache
        if: success() && github.event_name != 'pull_request' && steps.restore-emsdk.outputs.cache-matched-key == ''
        uses: actions/cache/save@v5
        with:
          path: .devtools/emsdk
          key: ${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}

      - name: Save ccache
        if: success() && github.event_name != 'pull_request' && steps.restore-ccache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-web-ccache
